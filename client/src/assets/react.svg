import { Bell, ChevronDown, LogOut } from "lucide-react";
import { useState } from "react";

function Topbar({ user, onLogout }) {
  const [open, setOpen] = useState(false);

  const today = new Date().toLocaleDateString("en-NG", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric",
  });

  return (
    <div style={styles.topbar}>
      <div>
        <h2 style={{ margin: 0 }}>Welcome, {user?.first_name}</h2>
        <p style={styles.date}>{today}</p>
      </div>

      <div style={styles.right}>
        <div style={styles.bell}>
          <Bell size={22} />
          <span style={styles.badge}>3</span>
        </div>

        <div style={{ position: "relative" }}>
          <div
            style={styles.profile}
            onClick={() => setOpen(!open)}
          >
            <div style={styles.avatar}>
              {user?.first_name?.charAt(0)}
            </div>

            <div style={styles.userInfo}>
              <div style={styles.name}>
                {user?.first_name} {user?.last_name}
              </div>

              <div style={styles.role}>
                {user?.role_name || "University User"}
              </div>
            </div>

            <ChevronDown size={18} />
          </div>

          {open && (
            <div style={styles.dropdown}>
              <button
                style={styles.logout}
                onClick={onLogout}
              >
                <LogOut size={18} />
                Logout
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const styles = {
  topbar: {
    background: "white",
    padding: "18px 30px",
    display: "flex",
    justifyContent: "space-between",
    alignItems: "center",
    boxShadow: "0 4px 18px rgba(0,0,0,.06)",
  },

  date: {
    color: "#64748b",
    marginTop: 5,
  },

  right: {
    display: "flex",
    alignItems: "center",
    gap: 20,
  },

  bell: {
    position: "relative",
    cursor: "pointer",
  },

  badge: {
    position: "absolute",
    top: -5,
    right: -6,
    background: "#EF4444",
    color: "white",
    borderRadius: "50%",
    width: 18,
    height: 18,
    display: "flex",
    justifyContent: "center",
    alignItems: "center",
    fontSize: 11,
    fontWeight: "bold",
  },

  profile: {
    display: "flex",
    alignItems: "center",
    gap: 12,
    cursor: "pointer",
    padding: "8px 12px",
    borderRadius: 12,
    transition: "0.2s",
  },

  avatar: {
    width: 42,
    height: 42,
    borderRadius: "50%",
    background: "linear-gradient(135deg,#123C69,#2563EB)",
    color: "white",
    display: "flex",
    justifyContent: "center",
    alignItems: "center",
    fontWeight: "bold",
    fontSize: 18,
  },

  userInfo: {
    textAlign: "left",
  },

  name: {
    fontWeight: "600",
    color: "#0F172A",
  },

  role: {
    fontSize: 13,
    color: "#64748b",
  },

  dropdown: {
    position: "absolute",
    right: 0,
    top: 60,
    background: "white",
    borderRadius: 12,
    boxShadow: "0 12px 30px rgba(0,0,0,.15)",
    width: 180,
    overflow: "hidden",
  },

  logout: {
    width: "100%",
    padding: "14px",
    border: "none",
    background: "white",
    display: "flex",
    alignItems: "center",
    gap: 10,
    cursor: "pointer",
    color: "#DC2626",
    fontWeight: "600",
  },
};

export default Topbar;